<body>

      {"inputs":[{"internalType":"uint256","name":"numSpins","type":"uint256"}],"name":"buySpins","outputs":[],"stateMutability":"payable"},
      {"inputs":[{"internalType":"uint256","name":"numSpins","type":"uint256"}],"name":"getSpinPrice","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"pure"},

      {"inputs":[],"name":"renounceOwnership","outputs":[],"stateMutability":"nonpayable"},
      {"inputs":[{"internalType":"address","name":"_nft","type":"address"}],"name":"setNFTContract","outputs":[],"stateMutability":"nonpayable"},
      {"inputs":[{"internalType":"bool","name":"v","type":"bool"}],"name":"setPaused","outputs":[],"stateMutability":"nonpayable"},
      {"inputs":[{"internalType":"uint256","name":"betIndex","type":"uint256"}],"name":"spin","outputs":[],"stateMutability":"payable"},
      {"inputs":[],"name":"spinWithPackage","outputs":[],"stateMutability":"nonpayable"},
      {"inputs":[{"internalType":"address","name":"newOwner","type":"address"}],"name":"transferOwnership","outputs":[],"stateMutability":"nonpayable"},
      {"inputs":[],"name":"winChance","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view"},
      {"inputs":[],"name":"winMultiplier","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view"},
      {"inputs":[],"name":"withdraw","outputs":[],"stateMutability":"nonpayable"},
      {"stateMutability":"payable","type":"receive"}
    ];

    const SYMBOLS = ["🍒","🍋","🍉","🔔","💎","7️⃣","🃏","⭐","💰","👑"];

    let provider, signer, slot, address, bets = [], betIdx = 0, spinning = false;
    let prepaidSpins = 0, userBalance = 0;

    const btnConnect = document.getElementById("btnConnect");
    const connLabel = document.getElementById("connLabel");
    const walletAddr = document.getElementById("walletAddr");
    const walletBal = document.getElementById("walletBal");
    const jackpotVal = document.getElementById("jackpotVal");
    const betRow = document.getElementById("betRow");
    const btnSpin = document.getElementById("btnSpin");
    const spinBtnText = document.getElementById("spinBtnText");
    const status = document.getElementById("status");
    const txRow = document.getElementById("txRow");
    const spinsLeft = document.getElementById("spinsLeft");
    const switchNetworkBtn = document.getElementById("switchNetworkBtn");

    // --- AUDIO ---
    let audioCtx;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function playTone(freq, type, dur, vol=0.2, delay=0) {
      try {
        const ctx = getAudioCtx();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = type; o.frequency.setValueAtTime(freq, ctx.currentTime+delay);
        g.gain.setValueAtTime(vol, ctx.currentTime+delay);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+delay+dur);
        o.start(ctx.currentTime+delay); o.stop(ctx.currentTime+delay+dur+0.01);
      } catch {}
    }
    function playNoise(dur, vol=0.12) {
      try {
        const ctx = getAudioCtx();
        const buf = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i=0; i<data.length; i++) data[i]=(Math.random()*2-1);
        const src = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
        f.type='bandpass'; f.frequency.value=800; f.Q.value=0.5;
        src.buffer=buf; src.connect(f); f.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(vol, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
        src.start(); src.stop(ctx.currentTime+dur+0.05);
      } catch {}
    }
    function soundSpin() {
      for (let i=0; i<3; i++) {
        playTone(180+i*60,'sawtooth',0.13,0.09,i*0.07);
        playTone(180+i*60*1.5,'sawtooth',0.10,0.07,i*0.07+0.04);
      }
      playNoise(0.3,0.13);
    }
    function soundWin() { [523,659,784,1047].forEach((f,i)=>playTone(f,'sine',0.18,0.25,i*0.12)); }
    function soundJackpot() {
      [523,659,784,1047,1319,1568].forEach((f,i)=>{
        playTone(f,'sine',0.25,0.3,i*0.1);
        playTone(f*1.5,'triangle',0.18,0.15,i*0.1+0.05);
      });
    }
    function soundLose() {
      playTone(220,'sawtooth',0.18,0.15);
      playTone(180,'sawtooth',0.18,0.15,0.1);
      playTone(150,'sawtooth',0.2,0.12,0.22);
    }

    // --- NETWORK ---
    async function checkNetwork() {
      if (!window.ethereum) return false;
      const chainId = await window.ethereum.request({ method: 'eth_chainId' });
      if (parseInt(chainId, 16) !== 143) {
        status.textContent = "Please switch to Monad Mainnet (chain 143)";
        status.className = "status network";
        btnSpin.disabled = true;
        switchNetworkBtn.style.display = "block";
        return false;
      }
      status.className = "status";
      btnSpin.disabled = false;
      switchNetworkBtn.style.display = "none";
      return true;
    }

    if (window.ethereum) {
      window.ethereum.on('chainChanged', () => checkNetwork());
    }

    switchNetworkBtn.onclick = async function() {
      if (!window.ethereum) return;
      try {
        await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x8f' }] });
      } catch (e) {
        if (e.code === 4902) {
          await window.ethereum.request({
            method: 'wallet_addEthereumChain',
            params: [{
              chainId: '0x8f',
              chainName: 'Monad Mainnet',
              nativeCurrency: { name: 'MON', symbol: 'MON', decimals: 18 },
              rpcUrls: ['https://rpc.monad.xyz'],
              blockExplorerUrls: ['https://explorer.monad.xyz']
            }]
          });
        }
      }
    };

    // --- WALLET CONNECT ---
    btnConnect.onclick = async function() {
      if (!window.ethereum) { status.textContent = "Install MetaMask or Rabby"; return; }
      provider = new ethers.BrowserProvider(window.ethereum, "any");
      await window.ethereum.request({ method: "eth_requestAccounts" });
      signer = await provider.getSigner();
      address = await signer.getAddress();
      slot = new ethers.Contract(SLOT_ADDR, SLOT_ABI, signer);
      connLabel.textContent = "Connected";
      btnConnect.classList.add("connected");
      walletAddr.textContent = address.slice(0,6) + "..." + address.slice(-4);
      await checkNetwork();
      loadBalance();
      loadBets();
      loadJackpot();
    };

    async function loadBalance() {
      if (!provider || !address) return;
      const bal = await provider.getBalance(address);
      userBalance = Number(ethers.formatEther(bal));
      walletBal.textContent = userBalance.toFixed(4) + " MON";
    }

    async function loadBets() {
      if (!slot) return;
      const len = await slot.allowedBetsLength();
      bets = [];
      for (let i = 0; i < Number(len); i++) {
        const v = await slot.allowedBets(i);
        bets.push({ idx: i, value: v, label: Number(ethers.formatEther(v)).toFixed(4) + " MON" });
      }
      betIdx = 0;
      renderBets();
    }

    function renderBets() {
      betRow.innerHTML = "Bet: ";
      bets.forEach((b, i) => {
        const btn = document.createElement("button");
        btn.className = "bet-btn" + (i === betIdx ? " active" : "");
        btn.textContent = b.label;
        btn.onclick = () => { betIdx = i; renderBets(); };
        betRow.appendChild(btn);
      });
    }

    async function loadJackpot() {
      if (!slot) return;
      const jp = await slot.jackpotPool();
      jackpotVal.textContent = Number(ethers.formatEther(jp)).toFixed(4);
    }
    setInterval(loadJackpot, 8000);

    function updateSpinsLeft() { spinsLeft.textContent = "Spins left: " + prepaidSpins; }

    async function buyPackage(spins, moons) {
      if (!slot || !signer) { status.textContent = "Connect wallet first!"; return; }
      if (spinning) return;
      if (userBalance < moons) {
        status.textContent = "Not enough MON for this package!";
        status.className = "status lose";
        return;
      }
      try {
        status.textContent = `Buying ${spins} spins for ${moons} MON...`;
        status.className = "status";
        btnSpin.disabled = true;
        const tx = await slot.buySpins(spins, { value: ethers.parseEther(moons.toString()) });
        txRow.innerHTML = `<a class="txlink" href="https://explorer.monad.xyz/tx/${tx.hash}" target="_blank">TX: ${tx.hash.slice(0,10)}...</a>`;
        await tx.wait();
        prepaidSpins = Number(await slot.prepaidSpins(address));
        updateSpinsLeft();
        status.textContent = `Package purchased! You have ${prepaidSpins} spins.`;
        status.className = "status win";
        btnSpin.disabled = false;
        loadBalance();
      } catch (e) {
        status.textContent = e.reason || e.shortMessage || e.message || "TX failed";
        status.className = "status lose";
        btnSpin.disabled = false;
      }
    }
    window.buyPackage = buyPackage;
    updateSpinsLeft();

    // --- SPIN ---
    btnSpin.onclick = async function() {
      if (!slot || spinning) return;
      if (!(await checkNetwork())) return;
      prepaidSpins = Number(await slot.prepaidSpins(address));
      spinning = true;
      btnSpin.disabled = true;
      btnSpin.classList.add("loading");
      spinBtnText.innerHTML = '<span class="spinner"></span> SPIN';
      txRow.innerHTML = "";
      let tx, receipt, spinEvent;
      try {
        if (prepaidSpins > 0) {
          status.textContent = "Spinning (prepaid)...";
          status.className = "status";
          soundSpin();
          tx = await slot.spinWithPackage();
        } else {
          status.textContent = "Spinning...";
          status.className = "status";
          soundSpin();
          const bet = bets[betIdx];
          tx = await slot.spin(bet.idx, { value: bet.value });
        }
        txRow.innerHTML = `<a class="txlink" href="https://explorer.monad.xyz/tx/${tx.hash}" target="_blank">TX: ${tx.hash.slice(0,10)}...</a>`;
        status.textContent = "Waiting for result...";
        receipt = await tx.wait();

        // Parse Spin event
        spinEvent = receipt.logs.map(log => {
          try { return slot.interface.parseLog(log); } catch { return null; }
        }).find(e => e && e.name === "Spin");

        await animateReels();

        if (spinEvent) {
          const { win, jackpot, rand } = spinEvent.args;
          const r = Number(rand);
          if (jackpot) {
            const sym = r % SYMBOLS.length;
            setReels([sym, sym, sym]);
            highlightReels([0,1,2], "#00ffff");
            status.textContent = "🎉 JACKPOT! You won the pool!";
            status.className = "status jackpot";
            soundJackpot();
          } else if (win) {
            const sym = r % SYMBOLS.length;
            setReels([sym, sym, sym]);
            highlightReels([0,1,2], "#bf00ff");
            status.textContent = "⭐ You win! Payout sent!";
            status.className = "status win";
            soundWin();
          } else {
            let s1 = r % SYMBOLS.length;
            let s2 = (s1 + 1 + Math.floor(Math.random()*4)) % SYMBOLS.length;
            let s3 = (s1 + 3 + Math.floor(Math.random()*4)) % SYMBOLS.length;
            if (s2 === s1) s2 = (s2+1) % SYMBOLS.length;
            if (s3 === s1 || s3 === s2) s3 = (s3+2) % SYMBOLS.length;
            setReels([s1, s2, s3]);
            clearHighlight();
            status.textContent = "No win. Try again!";
            status.className = "status lose";
            soundLose();
          }
        } else {
          status.textContent = "Spin complete!";
          status.className = "status";
        }

        setTimeout(clearHighlight, 1500);
        prepaidSpins = Number(await slot.prepaidSpins(address));
        updateSpinsLeft();
        loadBalance();
        loadJackpot();
      } catch (e) {
        status.textContent = e.reason || e.shortMessage || e.message || "TX failed";
        status.className = "status lose";
        soundLose();
      }
      spinning = false;
      btnSpin.disabled = false;
      btnSpin.classList.remove("loading");
      spinBtnText.textContent = "SPIN";
    };

    // --- REELS ---
    function randSym() { return Math.floor(Math.random() * SYMBOLS.length); }
    function setReels(arr) {
      for (let i = 0; i < 3; i++) document.getElementById("reel"+i).textContent = SYMBOLS[arr[i] % SYMBOLS.length];
    }
    async function animateReels() {
      for (let t = 0; t < 14; t++) {
        setReels([randSym(), randSym(), randSym()]);
        await new Promise(res => setTimeout(res, 55));
      }
    }
    function highlightReels(indices, color) {
      for (let i = 0; i < 3; i++) {
        document.getElementById("reel"+i).style.boxShadow = indices.includes(i)
          ? `0 0 64px 16px ${color}, 0 12px 48px #bf00ff30, 0 0 0 8px var(--gold) inset`
          : "0 12px 48px #bf00ff30, 0 0 0 8px var(--gold) inset";
      }
    }
    function clearHighlight() {
      for (let i = 0; i < 3; i++) {
        document.getElementById("reel"+i).style.boxShadow = "0 12px 48px #bf00ff30, 0 0 0 8px var(--gold) inset";
      }
    }

    setReels([randSym(), randSym(), randSym()]);
  </script>
</body>
</html>
